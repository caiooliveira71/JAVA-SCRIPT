<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Painel Digital</title>
</head>
<body>
    <div class="central">

        <h1>Painel Digital</h1>
        <div class="relogio">
            <span id="relogio">00:00:00</span>
        </div>

        <div class="data">
            <span id="data">00/00/00</span>
        </div>
        
        <div class="informação">

        <div class="caixa">
            <span>Dia</span>
            <span id="dia">00</span>
        </div>

        <div class="caixa">
            <span>Mês</span>
            <span id="mes">00</span>
        </div>

        <div class="caixa">
            <span>Ano</span>
            <span id="ano">00</span>
        </div>

        </div>

        <div id="mensagem">
            Boa Tarde
        </div>

        <p>
            PAINEL ATUALIZADO AUTOMATICAMENTE
        </p>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
